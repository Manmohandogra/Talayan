:root{--ink:#0b0e23;--saffron:#e8963f;--brass:#c9a24b;--rose:#c8447e;--cream:#f7efe0;
      --serif:'Fraunces',Georgia,serif;--sans:'Poppins',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1080px;height:1350px;}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);position:relative;overflow:hidden;}
.glow{position:absolute;border-radius:50%;filter:blur(90px);}
.g1{width:640px;height:640px;background:#2a2170;top:-230px;left:-170px;opacity:.55;}
.g2{width:600px;height:600px;background:#7a3a1f;bottom:-220px;right:-170px;opacity:.40;}
.mandala{position:absolute;color:var(--brass);opacity:.09;}
.m1{width:780px;top:-200px;right:-220px;} .m2{width:640px;bottom:-210px;left:-210px;}
.mandala svg{width:100%;height:auto;display:block;}
.inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
       align-items:center;justify-content:space-between;padding:58px 40px 50px;}
.head{display:flex;flex-direction:column;align-items:center;}
.eyebrow{font-family:var(--serif);font-size:29px;color:var(--brass);letter-spacing:.02em;}
.word{font-family:var(--serif);font-weight:600;font-size:142px;line-height:.96;letter-spacing:.035em;
      margin-top:8px;text-shadow:0 8px 40px rgba(0,0,0,.5);}
.ver{font-family:var(--serif);font-weight:600;font-size:78px;color:var(--saffron);line-height:1;margin-top:6px;}
.eq{display:flex;align-items:flex-end;gap:7px;height:32px;margin-top:22px;}
.eq i{width:7px;border-radius:4px;background:linear-gradient(var(--rose),var(--saffron));display:block;}
.row{display:flex;gap:16px;width:100%;justify-content:center;}
.p{width:238px;display:flex;flex-direction:column;}
.ph{width:100%;height:288px;border-radius:14px;overflow:hidden;position:relative;
    border:1px solid rgba(201,162,75,.45);background:#000;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(11,14,35,.72));}
.nm{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.16;margin-top:14px;
    text-align:center;height:58px;}
.rl{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);text-align:center;}

.band{display:flex;align-items:center;gap:22px;width:100%;}
.band span{font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:var(--brass);
           font-weight:500;white-space:nowrap;}
.band i{flex:1;height:1px;background:rgba(201,162,75,.42);display:block;}
.foot{display:flex;flex-direction:column;align-items:center;}
.soon{font-family:var(--serif);font-weight:600;font-size:66px;letter-spacing:.07em;color:var(--saffron);line-height:1;}
.blurb{font-family:var(--serif);font-size:25px;color:rgba(247,239,224,.9);margin-top:16px;
       text-align:center;line-height:1.45;}
.links{font-size:20px;letter-spacing:.13em;color:rgba(247,239,224,.9);margin-top:26px;}
.links b{color:var(--saffron);font-weight:500;}

<script>
function mandala(){var p=[],N=16,P=12,i,a;
[96,74,50,24].forEach(function(r){p.push('<circle cx="100" cy="100" r="'+r+'" fill="none" stroke="currentColor" stroke-width="0.5"/>');});
for(i=0;i<N;i++){a=(i/N)*2*Math.PI;var x1=100+50*Math.cos(a),y1=100+50*Math.sin(a),x2=100+74*Math.cos(a),y2=100+74*Math.sin(a);
p.push('<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="currentColor" stroke-width="0.5"/>');
p.push('<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="1.5" fill="currentColor"/>');}
for(i=0;i<P;i++){p.push('<ellipse cx="100" cy="63" rx="6" ry="19" fill="none" stroke="currentColor" stroke-width="0.5" transform="rotate('+(i*360/P)+' 100 100)"/>');}
return '<svg viewBox="0 0 200 200">'+p.join('')+'</svg>';}
document.getElementById('m1').innerHTML=mandala();document.getElementById('m2').innerHTML=mandala();
</script></body></html>
